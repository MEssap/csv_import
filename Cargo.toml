[package]
name = "csv_import"
version = "0.1.0"
edition = "2021"

[dependencies]
# GUI
eframe = "0.27"
egui = "0.27"
rfd = "0.14"

# CSV parsing
csv = "1.3"

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.11", features = ["blocking", "json"] }

# Encoding conversion
encoding_rs = "0.8"

# Async runtime (for async operations)
tokio = { version = "1", features = ["full"] }

# Cross-thread communication
crossbeam = "0.8"

# Logging
log = "0.4"
env_logger = "0.11"
